<!doctype html>
<html
  lang="zh-CN"
  class="layout-navbar-fixed layout-wide"
  dir="ltr"
  data-skin="default"
  data-bs-theme="light"
  data-assets-path="./assets/"
  data-template="front-pages">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Super CC | 复活节彩蛋狩猎</title>
    <meta name="description" content="Super Event 复活节彩蛋狩猎提交入口。" />

    <link rel="icon" type="image/png" href="./assets/img/super/logo.png" />

    <link rel="stylesheet" href="./assets/vendor/css/core.css" />
    <link rel="stylesheet" href="./assets/css/demo.css" />
    <link rel="stylesheet" href="./assets/vendor/css/pages/front-page.css" />
    <link rel="stylesheet" href="./assets/vendor/css/pages/front-page-landing.css" />
    <link rel="stylesheet" href="./assets/css/super-event.css" />
  </head>

  <body>
    <nav class="layout-navbar shadow-none py-0 super-navbar">
      <div class="container">
        <div class="navbar navbar-expand-lg landing-navbar px-3 px-md-8">
          <div class="navbar-brand app-brand demo d-flex py-0 me-4 me-xl-8 ms-0">
            <button
              class="navbar-toggler border-0 px-0 me-4"
              type="button"
              data-bs-toggle="collapse"
              data-bs-target="#navbarSupportedContent"
              aria-controls="navbarSupportedContent"
              aria-expanded="false"
              aria-label="Toggle navigation">
              <span class="navbar-toggler-icon"></span>
            </button>
            <a href="./index.html" class="app-brand-link">
              <span class="app-brand-logo demo">
                <img src="./assets/img/super/logo.png" alt="Super Event logo" class="super-logo" />
              </span>
              <span class="app-brand-text demo menu-text fw-bold ms-2 ps-1">Super Event</span>
            </a>
          </div>

          <div class="collapse navbar-collapse landing-nav-menu" id="navbarSupportedContent">
            <ul class="navbar-nav me-auto">
              <li class="nav-item">
                <a class="nav-link fw-medium" href="./index.html">活动介绍</a>
              </li>
              <li class="nav-item">
                <a class="nav-link fw-medium" href="./tips.html">活动提示</a>
              </li>
              <li class="nav-item">
                <a class="nav-link fw-medium active" href="./signup.html">提交入口</a>
              </li>
            </ul>
          </div>
        </div>
      </div>
    </nav>

    <main class="section-py super-page-shell">
      <div class="container">
        <div class="super-page-heading text-center mb-8">
          <span class="badge bg-label-danger super-badge mb-4">提交入口</span>
          <h1 class="mb-3">完成狩猎后，在这里提交结果</h1>
          <p class="mb-0">请确认截图符合要求，再通过下方表单进行提交。</p>
        </div>

        <div class="card super-iframe-card">
          <div class="card-body p-3 p-md-4">
            <iframe
              id="idy_frame"
              height="100%"
              width="100%"
              src="https://wj.qq.com/s2/26151444/9cd1/"
              frameborder="0"
              style="min-height: 650px"
              allowfullscreen
              sandbox="allow-same-origin allow-scripts allow-modals allow-downloads allow-forms allow-popups"></iframe>
          </div>
        </div>
      </div>
    </main>

    <footer class="landing-footer super-footer">
      <div class="container">
        <div class="super-footer-main">
          <div class="super-footer-brand">
            <img src="./assets/img/super/logo.png" alt="Super Event logo" class="super-footer-logo" />
            <div>
              <h5 class="mb-2 text-white">Super Event</h5>
              <p class="mb-0">请按要求上传有效截图，祝你冲榜成功。</p>
            </div>
          </div>
          <div class="super-footer-links">
            <a href="./index.html">活动介绍</a>
            <a href="./tips.html">活动提示</a>
            <a href="./signup.html">提交入口</a>
          </div>
        </div>
        <div class="super-footer-bottom">©2026 Super Event</div>
      </div>
    </footer>

    <script src="./assets/vendor/libs/popper/popper.js"></script>
    <script src="./assets/vendor/js/bootstrap.js"></script>
    <script>
      window.addEventListener('scroll', function () {
        const nav = document.querySelector('.super-navbar');
        if (window.scrollY > 10) nav.classList.add('navbar-active');
        else nav.classList.remove('navbar-active');
      });

      document.addEventListener('contextmenu', function (event) {
        event.preventDefault();
      });

      document.addEventListener('dragstart', function (event) {
        if (event.target.tagName === 'IMG') {
          event.preventDefault();
        }
      });

      document.addEventListener('keydown', function (event) {
        const blocked =
          event.key === 'F12' ||
          (event.ctrlKey && ['s', 'u', 'p'].includes(event.key.toLowerCase())) ||
          (event.ctrlKey && event.shiftKey && ['i', 'j', 'c'].includes(event.key.toLowerCase()));

        if (blocked) {
          event.preventDefault();
        }
      });
    </script>
  </body>
</html>
